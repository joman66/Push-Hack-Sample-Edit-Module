name: Release

# A v* tag builds the hack, publishes a GitHub Release with sample-edit.tar.gz,
# and commits release.json to main for Push Hack Catalog.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version match
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          HACK_VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' hack.json)
          if [ "$TAG_VERSION" != "$HACK_VERSION" ]; then
            echo "ERROR: tag $TAG_VERSION does not match hack.json version $HACK_VERSION"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # CGO_ENABLED=0 (set in the Makefile) keeps the binary static, so the
      # runner's glibc does not leak into it.
      - name: Build and package
        run: |
          make package
          file sample-edit | grep -q 'statically linked'

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sample-edit.tar.gz
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Commit release.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git fetch origin main
          git checkout -f main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cat > release.json << JSON
          {
            "version": "${VERSION}",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sample-edit.tar.gz",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          git add release.json
          git commit -m "chore: release.json for ${{ github.ref_name }}" || echo "no change"
          git push origin main
